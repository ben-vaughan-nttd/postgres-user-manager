name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'
      - 'v[0-9].[0-9].[0-9]-*'
      - '[0-9].[0-9].[0-9]'
      - '[0-9].[0-9].[0-9]-*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true
    
    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Install Syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # pg_query_go needs CGO, so releases are cross compiled with the C toolchains
    # in the goreleaser-cross image (linux amd64/arm64, darwin amd64/arm64,
    # windows amd64). Syft, the Docker socket and the registry login are
    # mounted in for the SBOM and image steps.
    - name: Run GoReleaser (goreleaser-cross)
      env:
        GOLANG_CROSS_VERSION: v1.27
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        docker run --rm \
          -e GITHUB_TOKEN \
          -e GITHUB_REPOSITORY_OWNER \
          -e GIT_CONFIG_COUNT=1 \
          -e GIT_CONFIG_KEY_0=safe.directory \
          -e GIT_CONFIG_VALUE_0=/work \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
          -v "$(command -v syft):/usr/local/bin/syft:ro" \
          -v "$PWD:/work" \
          -w /work \
          "ghcr.io/goreleaser/goreleaser-cross:${GOLANG_CROSS_VERSION}" \
          release --clean
    
    - name: Upload artifacts to GitHub Packages
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: dist/
