version: 2
updates:
  # Keep Go modules and GitHub Actions updates in one weekly group.
  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
